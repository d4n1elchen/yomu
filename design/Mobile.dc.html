<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Serif+JP:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #fbfaf7; color: #22201c;
           font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #7a4a2b; text-decoration: none; }
    a:hover { color: #5c3620; }
    .jp { font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', serif; }
    rt { font-size: 0.48em; color: #8f887c; user-select: none; }
    .mk { border-bottom: 1.5px dashed #b08a5e; }
    .picked { background: #f0e6dc; }
    .selrange { background: #d8e5f0; }
    .tab { padding: 5px 12px; border-radius: 999px; font-size: 11.5px; cursor: pointer; border: 1px solid #e2ded4; color: #8f887c; }
    .tab.on { background: #f0e6dc; border-color: #7a4a2b; color: #22201c; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #fbfaf7; overflow: hidden;">

  <!-- top bar -->
  <div style="display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 54px; border-bottom: 1px solid #e2ded4; flex-shrink: 0;">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#6f6a60" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"></path></svg>
    <div class="jp" style="flex-grow: 1; font-size: 16px; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">図書館の午後</div>
    <div style="display: flex; align-items: center; gap: 7px;">
      <span style="font-size: 11.5px; color: #22201c;">詞彙</span>
      <div style="width: 34px; height: 20px; border-radius: 999px; background: #7a4a2b; padding: 2px; display: flex; justify-content: flex-end;">
        <div style="width: 16px; height: 16px; border-radius: 50%; background: #ffffff; box-shadow: 0 1px 2px rgba(0,0,0,0.25);"></div>
      </div>
    </div>
  </div>

  <!-- which panel to preview -->
  <div style="display: flex; gap: 6px; padding: 10px 16px 0;">
    <div class="tab {{wordTab}}" onClick="{{showWord}}">點選詞彙</div>
    <div class="tab {{askTab}}" onClick="{{showAsk}}">選取文字</div>
  </div>

  <!-- text -->
  <div class="jp" style="flex-grow: 1; padding: 14px 18px; font-size: 17px; line-height: 2.95; overflow: hidden;">
    <ruby>昨日<rt>きのう</rt></ruby>、<ruby>綾<rt>あや</rt></ruby><ruby>辻<rt>つじ</rt></ruby>さんは<ruby>図書館<rt>としょかん</rt></ruby>で<ruby>本<rt>ほん</rt></ruby>を<span class="mk"><ruby>三<rt>さん</rt></ruby><ruby>冊<rt>さつ</rt></ruby></span><ruby>借<rt>か</rt></ruby>りた。<ruby>彼女<rt>かのじょ</rt></ruby>は<ruby>静<rt>しず</rt></ruby>かな<ruby>席<rt>せき</rt></ruby>に<ruby>座<rt>すわ</rt></ruby>って、<ruby>時々<rt>ときどき</rt></ruby><ruby>窓<rt>まど</rt></ruby>の<ruby>外<rt>そと</rt></ruby>を<span class="mk {{wordHl}}"><ruby>眺<rt>なが</rt></ruby>め</span>ながら<span class="{{selHl}}"><ruby>読<rt>よ</rt></ruby>み<ruby>返<rt>かえ</rt></ruby>していた</span>。
  </div>

  <!-- OS selection menu, only in the select-text state -->
  <sc-if value="{{isAsk}}" hint-placeholder-val="{{ false }}">
    <div style="align-self: center; margin-bottom: 8px; display: flex; background: #3a3a3c; border-radius: 8px; overflow: hidden; box-shadow: 0 3px 12px rgba(0,0,0,0.28);">
      <span style="padding: 8px 15px; color: #fff; font-size: 12.5px;">コピー</span>
      <span style="width: 1px; background: #565658;"></span>
      <span style="padding: 8px 15px; color: #fff; font-size: 12.5px;">調べる</span>
      <span style="width: 1px; background: #565658;"></span>
      <span style="padding: 8px 15px; color: #fff; font-size: 12.5px;">共有</span>
    </div>
  </sc-if>

  <!-- bottom card -->
  <div style="flex-shrink: 0; border-top: 1px solid #ded7ca; background: #ffffff; box-shadow: 0 -6px 22px rgba(34,32,28,0.08); padding: 8px 20px 26px;">
    <div style="width: 36px; height: 4px; border-radius: 999px; background: #ded7ca; margin: 0 auto 14px;"></div>

    <sc-if value="{{isWord}}" hint-placeholder-val="{{ true }}">
      <div>
        <div style="display: flex; align-items: baseline; gap: 9px; margin-bottom: 3px;">
          <span class="jp" style="font-size: 23px; font-weight: 600;">眺める</span>
          <span class="jp" style="font-size: 14px; color: #8f887c;">ながめる</span>
          <span style="margin-left: auto; padding: 3px 9px; border-radius: 999px; background: #f4efe7; color: #7a4a2b; font-size: 11px;">動詞</span>
        </div>
        <div style="font-size: 12px; color: #a8a296; margin-bottom: 9px;">這裡的形式 <span class="jp" style="color: #6f6a60;">眺め</span></div>
        <ol style="margin: 0; padding-left: 18px;">
          <li style="font-size: 14px; line-height: 1.85; color: #3d3a34;">眺望；遠望</li>
          <li style="font-size: 14px; line-height: 1.85; color: #3d3a34;">凝視；注視</li>
          <li style="font-size: 14px; line-height: 1.85; color: #3d3a34;">袖手旁觀</li>
        </ol>
        <div style="display: flex; align-items: center; gap: 6px; margin-top: 14px; padding-top: 12px; border-top: 1px solid #efeae1; font-size: 12.5px; color: #7a4a2b;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7a4a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h9a3 3 0 0 1 3 3v11a2 2 0 0 0-2-2H4z"></path><path d="M20 5h-4a3 3 0 0 0-3 3v11a2 2 0 0 1 2-2h5z"></path></svg>
          Dictionary
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isAsk}}" hint-placeholder-val="{{ false }}">
      <div>
        <div style="font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase; color: #a8a296; margin-bottom: 3px;">選取的部分</div>
        <div class="jp" style="font-size: 15px; margin-bottom: 12px;">読み返していた</div>

        <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px;">
          <div style="display: flex;">
            <div style="max-width: 86%; padding: 9px 12px; border-radius: 12px 12px 12px 3px; background: #f4efe7; font-size: 13.5px; line-height: 1.85; white-space: pre-line;">「読み返していた」
想知道這個部分的什麼呢？可以直接問，或從下面選一個。</div>
          </div>
        </div>

        <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px;">
          <span style="padding: 5px 11px; border: 1px solid #e2ded4; border-radius: 999px; font-size: 12px; color: #6f6a60;">說明文法</span>
          <span style="padding: 5px 11px; border: 1px solid #e2ded4; border-radius: 999px; font-size: 12px; color: #6f6a60;">為何是這個形式？</span>
        </div>

        <div style="display: flex; align-items: center; gap: 8px; padding-top: 11px; border-top: 1px solid #efeae1;">
          <div style="flex-grow: 1; height: 36px; display: flex; align-items: center; padding: 0 12px; border: 1px solid #ded7ca; border-radius: 999px; background: #fbfaf7; font-size: 13px; color: #b3ada1;">輸入問題…</div>
          <div style="width: 36px; height: 36px; border-radius: 50%; background: #7a4a2b; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fbfaf7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 5l7 7-7 7"></path></svg>
          </div>
        </div>
        <div style="margin-top: 10px; font-size: 11px; color: #b3ada1;">不會儲存 — 關閉後即消失</div>
      </div>
    </sc-if>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'word' };
  }
  renderVals() {
    const word = this.state.mode === 'word';
    return {
      isWord: word,
      isAsk: !word,
      wordTab: word ? 'on' : '',
      askTab: word ? '' : 'on',
      wordHl: word ? 'picked' : '',
      selHl: word ? '' : 'selrange',
      showWord: () => this.setState({ mode: 'word' }),
      showAsk: () => this.setState({ mode: 'ask' })
    };
  }
}
</script>
</body>
</html>
