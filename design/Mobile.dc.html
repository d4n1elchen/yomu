<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Serif+JP:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #fbfaf7; color: #22201c;
           font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #7a4a2b; text-decoration: none; }
    a:hover { color: #5c3620; }
    .jp { font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', serif; }
    rt { font-size: 0.48em; color: #8f887c; user-select: none; }
    .on .mk { border-bottom: 1.5px dashed #b08a5e; }
    .sel { background: #f0e6dc; border-bottom: 2px solid #7a4a2b !important; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #fbfaf7; overflow: hidden; position: relative;">

  <!-- top bar -->
  <div style="display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 54px; border-bottom: 1px solid #e2ded4; flex-shrink: 0;">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#6f6a60" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"></path></svg>
    <div class="jp" style="flex-grow: 1; font-size: 16px; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">図書館の午後</div>
    <div onClick="{{toggle}}" style="display: flex; align-items: center; gap: 7px;">
      <span style="font-size: 11.5px; color: {{labelColor}};">語彙</span>
      <div style="width: 34px; height: 20px; border-radius: 999px; background: {{track}}; padding: 2px; display: flex; justify-content: {{justify}};">
        <div style="width: 16px; height: 16px; border-radius: 50%; background: #ffffff; box-shadow: 0 1px 2px rgba(0,0,0,0.25);"></div>
      </div>
    </div>
  </div>

  <!-- text -->
  <div class="jp {{onClass}}" style="flex-grow: 1; padding: 22px 20px; font-size: 17px; line-height: 2.95; overflow: hidden;">
    <ruby>昨日<rt>きのう</rt></ruby>、<ruby>綾<rt>あや</rt></ruby><ruby>辻<rt>つじ</rt></ruby>さんは<ruby>図書館<rt>としょかん</rt></ruby>で<ruby>本<rt>ほん</rt></ruby>を<span class="mk"><ruby>三<rt>さん</rt></ruby><ruby>冊<rt>さつ</rt></ruby></span><ruby>借<rt>か</rt></ruby>りた。<ruby>彼女<rt>かのじょ</rt></ruby>は<ruby>静<rt>しず</rt></ruby>かな<ruby>席<rt>せき</rt></ruby>に<ruby>座<rt>すわ</rt></ruby>って、<ruby>時々<rt>ときどき</rt></ruby><ruby>窓<rt>まど</rt></ruby>の<ruby>外<rt>そと</rt></ruby>を<span class="mk {{selClass}}" onClick="{{tapWord}}"><ruby>眺<rt>なが</rt></ruby>め</span>ながら<span class="mk"><ruby>読<rt>よ</rt></ruby>み<ruby>返<rt>かえ</rt></ruby>し</span>ていた。
  </div>

  <!-- bottom panel -->
  <sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
    <div style="flex-shrink: 0; border-top: 1px solid #ded7ca; background: #ffffff; box-shadow: 0 -6px 22px rgba(34,32,28,0.08); padding: 8px 20px 26px;">
      <div style="width: 36px; height: 4px; border-radius: 999px; background: #ded7ca; margin: 0 auto 14px;"></div>

      <div style="display: flex; align-items: baseline; gap: 9px; margin-bottom: 4px;">
        <span class="jp" style="font-size: 24px; font-weight: 600;">眺める</span>
        <span class="jp" style="font-size: 14px; color: #8f887c;">ながめる</span>
        <span style="margin-left: auto; padding: 3px 9px; border-radius: 999px; background: #f4efe7; color: #7a4a2b; font-size: 11px;">動詞</span>
      </div>

      <div style="font-size: 12px; color: #a8a296; margin-bottom: 10px;">この文では <span class="jp" style="color: #6f6a60;">眺め</span></div>

      <div style="font-size: 14px; line-height: 1.85; color: #3d3a34;">遠望、眺望。比「見る」更有距離感，也帶有持續注視的語感。</div>

      <div style="display: flex; align-items: center; gap: 18px; margin-top: 16px; padding-top: 13px; border-top: 1px solid #efeae1;">
        <div style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #7a4a2b;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7a4a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h9a3 3 0 0 1 3 3v11a2 2 0 0 0-2-2H4z"></path><path d="M20 5h-4a3 3 0 0 0-3 3v11a2 2 0 0 1 2-2h5z"></path></svg>
          Dictionary
        </div>
        <div style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #7a4a2b;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7a4a2b" stroke-width="2" stroke-linecap="round"><path d="M9 9a3 3 0 1 1 4 2.8c-.7.3-1 .9-1 1.7v.5"></path><path d="M12 17h.01"></path></svg>
          この文について聞く
        </div>
        <div onClick="{{close}}" style="margin-left: auto; font-size: 20px; color: #a8a296; line-height: 1; cursor: pointer;">×</div>
      </div>
    </div>
  </sc-if>

</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { explain: true, open: true };
  }
  renderVals() {
    const on = this.state.explain;
    return {
      onClass: on ? 'on' : '',
      track: on ? '#7a4a2b' : '#d6d0c4',
      justify: on ? 'flex-end' : 'flex-start',
      labelColor: on ? '#22201c' : '#8f887c',
      toggle: () => this.setState({ explain: !on, open: false }),
      open: this.state.open && on,
      selClass: this.state.open && on ? 'sel' : '',
      tapWord: () => this.setState({ open: true }),
      close: () => this.setState({ open: false })
    };
  }
}
</script>
</body>
</html>
